name: FreeVela
options:
  bundleIdPrefix: io.github.joeblossom
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  FreeVela:
    type: application
    platform: iOS
    sources: [FreeVela]
    info:
      path: FreeVela/Info.plist
      properties:
        CFBundleDisplayName: FreeVela
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "21"
        NSBluetoothAlwaysUsageDescription: FreeVela connects to your bike over Bluetooth to read its state and send commands.
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [bluetooth-le]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Archivo-Variable.ttf]
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.joeblossom.FreeVela
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Olive AppIcon-SignalRed AppIcon-Coral AppIcon-Sunflower AppIcon-Midnight AppIcon-Sage AppIcon-Sky AppIcon-Petal AppIcon-Graphite"
